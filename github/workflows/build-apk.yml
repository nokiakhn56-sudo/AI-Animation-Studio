name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Android Project & Auto-Fix Common Issues
        run: |
          mkdir -p app/src/main/res/values app/src/main/res/layout

          # Detect package from MainActivity.kt or fallback
          if [ -f MainActivity.kt ]; then
            PKG=$(grep -oP 'package\s+\K[^\s;]+' MainActivity.kt | head -n 1)
          fi
          [ -z "$PKG" ] && PKG="com.example.app"
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"

          if [ -f MainActivity.kt ]; then
            cp MainActivity.kt "app/src/main/java/$PKG_PATH/"
          fi

          # Ensure AndroidManifest.xml has package & valid structure
          if [ -f AndroidManifest.xml ]; then
            cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          else
            cat << EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="$PKG">
              <application
                  android:label="App"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          fi

          # Copy styles if present, plus default strings/themes if missing
          [ -f styles.xml ] && cp styles.xml app/src/main/res/values/
          if [ ! -f app/src/main/res/values/strings.xml ]; then
            cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">AI Animation Studio</string>
          </resources>
          EOF
          fi

          # Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AndroidApp"
          include(":app")
          EOF

          # App build.gradle.kts
          cat << EOF > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "$PKG"
              compileSdk = 34

              defaultConfig {
                  applicationId = "$PKG"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK & Print Errors if Any
        run: |
          if ! gradle assembleDebug --stacktrace; then
            echo "=== ERROR SUMMARY ==="
            gradle assembleDebug --console=plain 2>&1 | grep -E "e:|error:|FAILURE:|Caused by:" | tail -n 30 || true
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
